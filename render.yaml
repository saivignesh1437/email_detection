# ==============================================================================
# Render Blueprint Specification
# Intelligent Email Detection and Management Platform
# ==============================================================================
# Services:
#   1. PostgreSQL Managed Database
#   2. Java DSA Spam Detection Engine (Private Service)
#   3. FastAPI Backend (Web Service)
#   4. React + Vite Frontend (Static Site)
# ==============================================================================

version: "1"

# ------------------------------------------------------------------------------
# 1. Managed PostgreSQL Database
# ------------------------------------------------------------------------------
databases:
  - name: email-detection-db
    databaseName: email_management_db
    user: email_user
    plan: free
    region: oregon

services:
  # ----------------------------------------------------------------------------
  # 2. Java DSA Spam Detection Engine (Private Service)
  #    Note: Render private services require a paid instance type (e.g. starter)
  #    as Render does not provide a free tier for 'pserv'.
  # ----------------------------------------------------------------------------
  - type: pserv
    name: dsa-spam-engine
    env: docker
    dockerfilePath: ./dsa-engine/Dockerfile
    dockerContext: ./dsa-engine
    plan: starter
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DSA_HOST
        value: 0.0.0.0

  # ----------------------------------------------------------------------------
  # 3. FastAPI Python Backend (Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: email-detection-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: email-detection-db
          property: connectionString
      - key: DSA_ENGINE_URL
        value: http://dsa-spam-engine:8080
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://email-detection-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440

  # ----------------------------------------------------------------------------
  # 4. React + Vite Frontend (Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: email-detection-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://email-detection-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
